name: job-queue-api
region: nyc

databases:
  - name: job-queue-redis
    engine: REDIS
    version: "7"
    production: true

services:
  - name: api
    github:
      repo: AlexanderWong/workspaces
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start:api
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: WORKERS_ENABLED
        value: "false"
      - key: MAX_JOB_RETRIES
        value: "3"
      - key: RETRY_BACKOFF_MS
        value: "1000"
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${job-queue-redis.REDIS_URL}

workers:
  - name: worker
    github:
      repo: AlexanderWong/workspaces
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start:worker
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: MAX_JOB_RETRIES
        value: "3"
      - key: RETRY_BACKOFF_MS
        value: "1000"
      - key: DEFAULT_JOB_SLEEP_MS
        value: "1000"
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${job-queue-redis.REDIS_URL}
